name: CI

on:
  push: {branches: [main]}
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r app/requirements.txt pytest flake8
      - run: flake8 app --max-line-length=100
      - run: pytest -q tests

  config-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Prometheus alert rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/prometheus:/p:ro" \
            prom/prometheus:v2.54.1 check rules /p/alerts.yml
      - name: Validate compose file
        run: DEMO_PASSWORD=x GRAFANA_PASSWORD=x docker compose config -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy filesystem scan
        run: |
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.55.2 fs \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .
      - name: Build image
        run: docker build -t task-api:ci app
      - name: Trivy image scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.55.2 image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 task-api:ci

  publish:
    needs: [test, config-validate, security]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: ghcr.io/${{ github.repository }}/task-api:latest

  deploy:
    needs: [publish]
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/secops-observability
            git pull --ff-only
            docker compose up -d --build
            docker image prune -f
